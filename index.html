<title>Renovit Strutture</title>
<style>
  :root {
    --verde: #2d6a2d;
    --verde-scuro: #1a3a1a;
    --verde-chiaro: #4a9a4a;
    --giallo: #f5c842;
    --bianco: #ffffff;
    --grigio-bg: #f0f2f0;
    --grigio-card: #e8ece8;
    --testo: #1a2a1a;
    --ombra: rgba(0,0,0,0.15);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: var(--grigio-bg);
    color: var(--testo);
    min-height: 100vh;
    padding-bottom: 80px;
  }

  /* HEADER */
  header {
    background: var(--verde-scuro);
    color: white;
    padding: 14px 16px 12px;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 2px 8px var(--ombra);
    display: flex;
    align-items: center;
    gap: 12px;
  }

  header img {
    height: 32px;
    filter: brightness(0) invert(1);
  }

  header h1 {
    font-size: 16px;
    font-weight: 600;
    letter-spacing: 0.5px;
    line-height: 1.2;
  }

  header span {
    font-size: 11px;
    opacity: 0.7;
    display: block;
  }

  /* SEARCH */
  .search-box {
    padding: 12px 16px 8px;
    background: var(--verde-scuro);
  }

  .search-box input {
    width: 100%;
    padding: 10px 14px;
    border-radius: 24px;
    border: none;
    font-size: 14px;
    background: rgba(255,255,255,0.15);
    color: white;
    outline: none;
  }

  .search-box input::placeholder { color: rgba(255,255,255,0.6); }

  /* COMUNE SECTION */
  .comune-section {
    margin: 12px 12px 0;
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 2px 6px var(--ombra);
  }

  .comune-header {
    background: var(--verde);
    color: white;
    padding: 13px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    cursor: pointer;
    user-select: none;
    transition: background 0.2s;
  }

  .comune-header:active { background: var(--verde-chiaro); }

  .comune-header h2 {
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 1px;
    text-transform: uppercase;
  }

  .comune-header .badge {
    background: rgba(255,255,255,0.25);
    border-radius: 12px;
    padding: 2px 10px;
    font-size: 12px;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .chevron {
    transition: transform 0.3s;
    font-size: 12px;
  }
  .chevron.open { transform: rotate(180deg); }

  /* STRUTTURE LIST */
  .strutture-list {
    background: white;
    max-height: 0;
    overflow: hidden;
    transition: max-height 0.35s ease;
  }
  .strutture-list.open { max-height: 2000px; }

  .struttura-item {
    border-bottom: 1px solid #e8ece8;
    padding: 12px 16px;
    cursor: pointer;
    transition: background 0.15s;
    display: flex;
    align-items: flex-start;
    gap: 12px;
  }

  .struttura-item:last-child { border-bottom: none; }
  .struttura-item:active { background: #f0f5f0; }

  .struttura-icon {
    width: 36px;
    height: 36px;
    border-radius: 8px;
    background: var(--grigio-card);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    flex-shrink: 0;
    margin-top: 2px;
  }

  .struttura-info { flex: 1; min-width: 0; }

  .struttura-nome {
    font-size: 13px;
    font-weight: 600;
    color: var(--testo);
    line-height: 1.3;
  }

  .struttura-indirizzo {
    font-size: 11px;
    color: #666;
    margin-top: 2px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .struttura-badges {
    display: flex;
    gap: 4px;
    margin-top: 5px;
    flex-wrap: wrap;
  }

  .badge-small {
    font-size: 10px;
    padding: 2px 7px;
    border-radius: 10px;
    font-weight: 600;
  }

  .badge-remoto { background: #e3f2e3; color: #2d6a2d; }
  .badge-fisico { background: #fff3cd; color: #856404; }
  .badge-entrambi { background: #e3eef8; color: #1a5276; }
  .badge-keybox { background: #fce4ec; color: #880e4f; }
  .badge-nota { background: #f3e5f5; color: #6a1b9a; }

  .struttura-arrow {
    color: #bbb;
    font-size: 16px;
    margin-top: 8px;
  }

  /* MODAL */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.5);
    z-index: 200;
    display: flex;
    align-items: flex-end;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s;
  }
  .modal-overlay.open { opacity: 1; pointer-events: all; }

  .modal {
    background: white;
    border-radius: 20px 20px 0 0;
    width: 100%;
    padding: 0 0 40px;
    transform: translateY(100%);
    transition: transform 0.3s ease;
    max-height: 85vh;
    overflow-y: auto;
  }
  .modal-overlay.open .modal { transform: translateY(0); }

  .modal-handle {
    width: 40px;
    height: 4px;
    background: #ddd;
    border-radius: 2px;
    margin: 12px auto 0;
  }

  .modal-header {
    padding: 16px 20px 12px;
    border-bottom: 1px solid #eee;
  }

  .modal-comune {
    font-size: 11px;
    font-weight: 700;
    color: var(--verde);
    text-transform: uppercase;
    letter-spacing: 1px;
  }

  .modal-nome {
    font-size: 17px;
    font-weight: 700;
    color: var(--testo);
    margin-top: 3px;
    line-height: 1.3;
  }

  .modal-indirizzo {
    font-size: 13px;
    color: #555;
    margin-top: 4px;
  }

  .modal-body { padding: 16px 20px; }

  .info-row {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    margin-bottom: 12px;
    padding: 10px 12px;
    background: var(--grigio-bg);
    border-radius: 10px;
  }

  .info-row .icon { font-size: 18px; flex-shrink: 0; }
  .info-row .label { font-size: 11px; color: #888; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
  .info-row .value { font-size: 13px; color: var(--testo); margin-top: 1px; font-weight: 500; }

  /* AZIONI */
  .azioni {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    padding: 0 20px;
    margin-top: 8px;
  }

  .btn-azione {
    padding: 14px 12px;
    border-radius: 14px;
    border: none;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    transition: transform 0.1s, box-shadow 0.1s;
  }

  .btn-azione:active { transform: scale(0.96); }

  .btn-maps {
    background: var(--verde);
    color: white;
    box-shadow: 0 4px 12px rgba(45,106,45,0.3);
  }

  .btn-nota {
    background: var(--giallo);
    color: #333;
    box-shadow: 0 4px 12px rgba(245,200,66,0.3);
  }

  .btn-azione .btn-icon { font-size: 24px; }
  .btn-azione .btn-label { font-size: 12px; }

  /* NOTA EDITOR */
  .nota-editor {
    padding: 0 20px;
    margin-top: 12px;
    display: none;
  }
  .nota-editor.show { display: block; }

  .nota-editor textarea {
    width: 100%;
    border: 2px solid var(--verde);
    border-radius: 10px;
    padding: 10px 12px;
    font-size: 13px;
    font-family: inherit;
    resize: none;
    height: 90px;
    outline: none;
  }

  .nota-editor .btn-salva {
    margin-top: 8px;
    width: 100%;
    padding: 12px;
    background: var(--verde);
    color: white;
    border: none;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
  }

  /* TOAST */
  .toast {
    position: fixed;
    bottom: 90px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--verde-scuro);
    color: white;
    padding: 10px 20px;
    border-radius: 24px;
    font-size: 13px;
    font-weight: 600;
    opacity: 0;
    transition: all 0.3s;
    z-index: 300;
    white-space: nowrap;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* FOOTER */
  footer {
    position: fixed;
    bottom: 0;
    width: 100%;
    background: var(--verde-scuro);
    color: rgba(255,255,255,0.6);
    text-align: center;
    font-size: 10px;
    padding: 8px;
    letter-spacing: 0.5px;
  }

  .hidden { display: none !important; }
</style>

// ============================================================
// NOTE SU GOOGLE SHEETS
// ============================================================
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyj6ytxi-LkPGp6E15ffnd5gunLgZaQ_KEKTQbNcen3VYjInR9TB8PoEk_c8WjVbZL_zA/exec';
let noteCache = {};

async function caricaNote() {
  try {
    const res = await fetch(SCRIPT_URL);
    const data = await res.json();
    data.forEach(r => {
      if (r.comune && r.nome) noteCache[r.comune + '||' + r.nome] = r.nota || '';
    });
    render(comuni);
  } catch(e) { console.warn('Note non caricate:', e); }
}

function getNota(comune, nome) {
  return noteCache[comune + '||' + nome] || '';
}

async function setNota(comune, nome, testo) {
  noteCache[comune + '||' + nome] = testo;
  try {
    await fetch(SCRIPT_URL, {
      method: 'POST',
      mode: 'no-cors',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ comune, nome, nota: testo })
    });
  } catch(e) { console.warn('Errore salvataggio:', e); }
}

// ============================================================
// RENDER
// ============================================================
let currentStruttura = null;

function render(dati) {
  const container = document.getElementById('mainContent');
  container.innerHTML = '';

  dati.forEach((comune, ci) => {
    if (comune.strutture.length === 0) return;

    const section = document.createElement('div');
    section.className = 'comune-section';
    section.style.marginTop = ci === 0 ? '12px' : '12px';

    const header = document.createElement('div');
    header.className = 'comune-header';
    header.innerHTML = `
      <h2>${comune.nome}</h2>
      <div class="badge">
        <span>${comune.strutture.length}</span>
        <span class="chevron" id="chev_${ci}">▼</span>
      </div>`;
    header.onclick = () => toggleComune(ci);

    const list = document.createElement('div');
    list.className = 'strutture-list' + (ci === 0 ? ' open' : '');
    list.id = 'list_' + ci;

    comune.strutture.forEach((s, si) => {
      const nota = getNota(comune.nome, s.nome);
      const item = document.createElement('div');
      item.className = 'struttura-item';
      item.innerHTML = `
        <div class="struttura-icon">${s.icon || '🏢'}</div>
        <div class="struttura-info">
          <div class="struttura-nome">${s.nome}</div>
          <div class="struttura-indirizzo">${s.indirizzo}</div>
          <div class="struttura-badges">
            ${s.gestione ? `<span class="badge-small badge-${s.gestione.toLowerCase()}">${s.gestione}</span>` : ''}
            ${s.keybox === 'Si' ? `<span class="badge-small badge-keybox">🔑 Keybox</span>` : ''}
            ${s.notaPos ? `<span class="badge-small badge-nota">📍 Nota accesso</span>` : ''}
            ${nota ? `<span class="badge-small badge-nota">✏️ Nota</span>` : ''}
          </div>
        </div>
        <div class="struttura-arrow">›</div>`;
      item.onclick = () => apriModal(comune, s);
      list.appendChild(item);
    });

    section.appendChild(header);
    section.appendChild(list);
    container.appendChild(section);
  });
}

function toggleComune(ci) {
  const list = document.getElementById('list_' + ci);
  const chev = document.getElementById('chev_' + ci);
  list.classList.toggle('open');
  chev.classList.toggle('open');
}

// ============================================================
// MODAL
// ============================================================
function apriModal(comune, s) {
  currentStruttura = { comune, s };
  document.getElementById('mComune').textContent = comune.nome;
  document.getElementById('mNome').textContent = s.nome;
  document.getElementById('mIndirizzo').textContent = s.indirizzo;

  const gestRow = document.getElementById('mGestioneRow');
  const keyRow = document.getElementById('mKeyboxRow');
  const posRow = document.getElementById('mNotaPosRow');
  const genRow = document.getElementById('mNotaGenRow');

  if (s.gestione) {
    document.getElementById('mGestione').textContent = s.gestione;
    gestRow.style.display = 'flex';
  } else { gestRow.style.display = 'none'; }

  if (s.keybox) {
    document.getElementById('mKeybox').textContent = s.keybox;
    keyRow.style.display = 'flex';
  } else { keyRow.style.display = 'none'; }

  if (s.notaPos) {
    document.getElementById('mNotaPos').textContent = s.notaPos;
    posRow.style.display = 'flex';
  } else { posRow.style.display = 'none'; }

  const notaGen = getNota(comune.nome, s.nome);
  if (notaGen) {
    document.getElementById('mNotaGen').textContent = notaGen;
    genRow.style.display = 'flex';
  } else { genRow.style.display = 'none'; }

  document.getElementById('notaText').value = notaGen;
  document.getElementById('notaEditor').classList.remove('show');
  document.getElementById('modal').classList.add('open');
}

function closeModal(e) {
  if (e.target === document.getElementById('modal')) {
    document.getElementById('modal').classList.remove('open');
  }
}

function apriMaps() {
  if (!currentStruttura) return;
  const { s } = currentStruttura;
  if (s.mapsUrl) {
    window.open(s.mapsUrl, '_blank');
  } else {
    const query = encodeURIComponent(s.nome + ' ' + s.indirizzo);
    window.open('https://maps.google.com/?q=' + query, '_blank');
  }
}

function toggleNota() {
  document.getElementById('notaEditor').classList.toggle('show');
}

async function salvaNota() {
  if (!currentStruttura) return;
  const { comune, s } = currentStruttura;
  const testo = document.getElementById('notaText').value.trim();
  mostraToast('Salvataggio...');
  await setNota(comune.nome, s.nome, testo);
  document.getElementById('notaEditor').classList.remove('show');
  mostraToast('Nota salvata ✓');
  render(comuni);
}

// ============================================================
// SEARCH
// ============================================================
function filterStrutture(q) {
  if (!q) { render(comuni); return; }
  q = q.toLowerCase();
  const filtrati = comuni.map(c => ({
    ...c,
    strutture: c.strutture.filter(s =>
      s.nome.toLowerCase().includes(q) ||
      s.indirizzo.toLowerCase().includes(q)
    )
  }));
  render(filtrati);
  // Apri tutti i comuni con risultati
  filtrati.forEach((c, ci) => {
    if (c.strutture.length > 0) {
      const list = document.getElementById('list_' + ci);
      const chev = document.getElementById('chev_' + ci);
      if (list) { list.classList.add('open'); }
      if (chev) { chev.classList.add('open'); }
    }
  });
}

// ============================================================
// TOAST
// ============================================================
function mostraToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

// ============================================================
// INIT
// ============================================================
caricaNote();
render(comuni);
</script>
