<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#173f2b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Strutture">
<link rel="manifest" href="manifest.json">
<title>Renovit Strutture</title>
<style>
:root{
  --green:#246b45;--green2:#173f2b;--green3:#2f8b5b;--yellow:#f4c84a;
  --bg:#eef2ef;--card:#fff;--text:#18221d;--muted:#6d7771;--line:#dfe6e1;
  --shadow:0 8px 24px rgba(19,51,34,.12);--danger:#a43131;
}
body.dark{
  --bg:#101713;--card:#18211c;--text:#edf4ef;--muted:#a9b6ad;--line:#2d3931;
  --shadow:0 8px 24px rgba(0,0,0,.28);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:Segoe UI,system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding-bottom:82px}
button,input,textarea{font:inherit}
button{cursor:pointer}
.top{
  position:sticky;top:0;z-index:50;background:linear-gradient(135deg,var(--green2),var(--green));
  color:#fff;padding:14px 14px 12px;box-shadow:0 3px 14px rgba(0,0,0,.22)
}
.head{display:flex;align-items:center;gap:11px}
.logo{width:42px;height:42px;border-radius:12px;background:rgba(255,255,255,.16);display:grid;place-items:center;font-size:23px}
.title{flex:1}.title h1{font-size:18px}.title p{font-size:11px;opacity:.75;margin-top:2px}
.icon-btn{border:0;background:rgba(255,255,255,.14);color:#fff;width:40px;height:40px;border-radius:12px;font-size:18px}
.search-wrap{display:flex;gap:8px;margin-top:12px}
.search-wrap input{flex:1;min-width:0;border:0;outline:0;border-radius:14px;padding:12px 14px;background:rgba(255,255,255,.15);color:#fff}
.search-wrap input::placeholder{color:rgba(255,255,255,.7)}
.clear{display:none;border:0;border-radius:12px;padding:0 14px;background:#fff;color:var(--green2);font-weight:800}
.toolbar{display:flex;gap:8px;padding:11px 12px 0;overflow-x:auto}
.tool{white-space:nowrap;border:1px solid var(--line);background:var(--card);color:var(--text);padding:9px 12px;border-radius:12px;font-size:12px;font-weight:700;box-shadow:0 2px 8px rgba(0,0,0,.05)}
.tool.active{background:var(--green);color:#fff;border-color:var(--green)}
.stats{padding:10px 14px 2px;color:var(--muted);font-size:12px}
.section{margin:11px 12px 0;border-radius:16px;overflow:hidden;background:var(--card);box-shadow:var(--shadow)}
.section-head{border:0;width:100%;background:var(--green);color:#fff;padding:14px 15px;display:flex;align-items:center;justify-content:space-between;text-align:left}
.section-head h2{font-size:14px;letter-spacing:.7px}
.count{background:rgba(255,255,255,.18);padding:4px 9px;border-radius:999px;font-size:11px}
.list{display:none}.list.open{display:block}
.item{display:flex;align-items:flex-start;gap:11px;padding:13px 14px;border-bottom:1px solid var(--line);cursor:pointer}
.item:last-child{border-bottom:0}.item:active{background:rgba(36,107,69,.08)}
.iicon{width:40px;height:40px;border-radius:12px;background:var(--bg);display:grid;place-items:center;font-size:20px;flex:0 0 auto}
.idata{flex:1;min-width:0}.iname{font-size:13px;font-weight:750;line-height:1.25}.iaddr{font-size:11px;color:var(--muted);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badges{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}.badge{font-size:10px;padding:3px 7px;border-radius:999px;background:#e7f3eb;color:#235f40;font-weight:700}
body.dark .badge{background:#253d2f;color:#bfe0ca}
.star{font-size:20px;color:#c5cbc7;margin-top:7px}
.empty{margin:26px 14px;padding:28px 18px;border-radius:16px;background:var(--card);text-align:center;color:var(--muted);box-shadow:var(--shadow)}
.overlay{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.58);display:none;align-items:flex-end}
.overlay.open{display:flex}
.modal{width:100%;max-height:90vh;overflow:auto;background:var(--card);border-radius:22px 22px 0 0;box-shadow:0 -10px 40px rgba(0,0,0,.25)}
.modal-top{position:sticky;top:0;background:var(--card);z-index:2;padding:14px 16px 12px;border-bottom:1px solid var(--line);display:flex;gap:12px}
.modal-txt{flex:1}.mcom{font-size:11px;color:var(--green3);font-weight:800;letter-spacing:.8px}.mname{font-size:18px;font-weight:800;margin-top:3px}.maddr{font-size:12px;color:var(--muted);margin-top:4px}
.close{border:0;background:var(--bg);color:var(--text);width:40px;height:40px;border-radius:12px;font-size:21px}
.modal-body{padding:14px 16px 25px}
.info{background:var(--bg);padding:11px 12px;border-radius:13px;margin-bottom:9px}.label{font-size:10px;color:var(--muted);font-weight:800;text-transform:uppercase;letter-spacing:.6px}.value{font-size:13px;margin-top:3px;white-space:pre-wrap;word-break:break-word}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:13px}
.action{border:0;border-radius:14px;padding:13px 8px;font-size:12px;font-weight:800}
.primary{background:var(--green);color:#fff}.secondary{background:var(--yellow);color:#27220d}.neutral{background:var(--bg);color:var(--text)}
.note-box{display:none;margin-top:12px}.note-box.show{display:block}.note-box textarea{width:100%;min-height:110px;border:2px solid var(--green);background:var(--card);color:var(--text);border-radius:13px;padding:11px;outline:0;resize:vertical}
.note-buttons{display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:8px}
.save{border:0;border-radius:12px;background:var(--green);color:#fff;padding:12px;font-weight:800}
.delete{border:0;border-radius:12px;background:#f3dddd;color:var(--danger);padding:12px;font-weight:800}
.menu{position:fixed;inset:0;z-index:120;background:rgba(0,0,0,.45);display:none;align-items:flex-end}.menu.open{display:flex}
.sheet{width:100%;background:var(--card);border-radius:22px 22px 0 0;padding:16px 16px 28px}.sheet h3{font-size:16px;margin-bottom:12px}
.sheet button,.file-label{display:block;width:100%;border:0;background:var(--bg);color:var(--text);padding:13px;border-radius:12px;margin-top:8px;text-align:left;font-weight:700}
.file-label input{display:none}
.toast{position:fixed;left:50%;bottom:88px;z-index:200;transform:translate(-50%,20px);opacity:0;background:var(--green2);color:#fff;padding:10px 17px;border-radius:999px;font-size:12px;font-weight:750;transition:.25s;pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,0)}
footer{position:fixed;bottom:0;width:100%;z-index:40;background:var(--green2);color:rgba(255,255,255,.72);padding:9px;text-align:center;font-size:10px}
@media(min-width:720px){.top,.toolbar,.stats,#mainContent{max-width:760px;margin-left:auto;margin-right:auto}.modal,.sheet{max-width:720px;margin:auto}.overlay,.menu{align-items:center}.modal,.sheet{border-radius:22px}}
</style>
</head>
<body>
<div class="top">
  <div class="head">
    <div class="logo">🧰</div>
    <div class="title"><h1>Renovit Strutture</h1><p>Provincia di Milano · archivio personale</p></div>
    <button class="icon-btn" onclick="toggleDark()" title="Tema">◐</button>
    <button class="icon-btn" onclick="openMenu()" title="Menu">⋮</button>
  </div>
  <div class="search-wrap">
    <input id="searchInput" type="search" placeholder="Cerca luogo, comune, indirizzo o nota…" oninput="searchNow()">
    <button id="clearBtn" class="clear" onclick="clearSearch()">✕</button>
  </div>
</div>

<div class="toolbar">
  <button id="allBtn" class="tool active" onclick="setFilter('all')">Tutte</button>
  <button id="favBtn" class="tool" onclick="setFilter('fav')">⭐ Preferite</button>
  <button id="notesBtn" class="tool" onclick="setFilter('notes')">✏️ Con note</button>
  <button class="tool" onclick="expandAll()">Apri tutto</button>
  <button class="tool" onclick="collapseAll()">Chiudi tutto</button>
</div>
<div class="stats" id="stats"></div>
<main id="mainContent"></main>

<div class="overlay" id="modal" onclick="overlayClose(event)">
  <section class="modal">
    <div class="modal-top">
      <div class="modal-txt">
        <div class="mcom" id="mComune"></div>
        <div class="mname" id="mNome"></div>
        <div class="maddr" id="mIndirizzo"></div>
      </div>
      <button class="close" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body">
      <div class="info" id="posRow"><div class="label">📍 Informazioni accesso / posizione</div><div class="value" id="mPos"></div></div>
      <div class="info" id="gestRow"><div class="label">⚙️ Gestione</div><div class="value" id="mGest"></div></div>
      <div class="info" id="keyRow"><div class="label">🔑 Keybox</div><div class="value" id="mKey"></div></div>
      <div class="info" id="noteRow"><div class="label">✏️ Nota personale</div><div class="value" id="mNote"></div></div>
      <div class="actions">
        <button class="action primary" onclick="openMaps()">🗺️ Apri Maps</button>
        <button class="action secondary" onclick="copyAddress()">📋 Copia indirizzo</button>
        <button class="action neutral" onclick="toggleFavorite()">⭐ Preferita</button>
        <button class="action neutral" onclick="toggleNote()">✏️ Modifica nota</button>
      </div>
      <div class="note-box" id="noteBox">
        <textarea id="noteText" placeholder="Scrivi informazioni utili, accessi, contatori, materiali, anomalie…"></textarea>
        <div class="note-buttons">
          <button class="save" onclick="saveNote()">💾 Salva nota</button>
          <button class="delete" onclick="deleteNote()">Elimina</button>
        </div>
      </div>
    </div>
  </section>
</div>

<div class="menu" id="menu" onclick="menuClose(event)">
  <div class="sheet">
    <h3>Gestione dati</h3>
    <button onclick="exportData()">⬇️ Esporta note e preferiti</button>
    <label class="file-label">⬆️ Importa backup<input type="file" accept=".json,application/json" onchange="importData(event)"></label>
    <button onclick="toggleDark()">◐ Cambia tema</button>
    <button onclick="closeMenu()">Chiudi</button>
  </div>
</div>

<div class="toast" id="toast"></div>
<footer>Renovit Strutture · dati salvati sul dispositivo</footer>

let current=null, filterMode="all", openSections=new Set([0]);
const key=(c,s)=>c+"__"+s;
const clean=s=>(s||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase();
const getNotes=()=>JSON.parse(localStorage.getItem("renovit_notes")||"{}");
const getFavs=()=>JSON.parse(localStorage.getItem("renovit_favs")||"{}");
const saveNotes=o=>localStorage.setItem("renovit_notes",JSON.stringify(o));
const saveFavs=o=>localStorage.setItem("renovit_favs",JSON.stringify(o));

function render(){
 const q=clean(document.getElementById("searchInput").value);
 const notes=getNotes(),favs=getFavs(),box=document.getElementById("mainContent");
 let total=0,visible=0,html="";
 comuni.forEach((c,ci)=>{
  total+=c.strutture.length;
  const rows=c.strutture.filter(s=>{
   const k=key(c.nome,s.nome),note=notes[k]||"";
   const hay=clean([c.nome,s.nome,s.indirizzo,s.notaPos,s.gestione,s.keybox,note].join(" "));
   return (!q||hay.includes(q))&&(filterMode==="all"||(filterMode==="fav"&&favs[k])||(filterMode==="notes"&&note));
  });
  if(!rows.length)return;
  visible+=rows.length;
  const opened=q||filterMode!=="all"||openSections.has(ci);
  html+=`<section class="section">
   <button class="section-head" onclick="toggleSection(${ci})"><h2>${esc(c.nome)}</h2><span class="count">${rows.length} ${opened?"▲":"▼"}</span></button>
   <div class="list ${opened?"open":""}" id="sec${ci}">`;
  rows.forEach(s=>{
   const k=key(c.nome,s.nome),note=notes[k]||"",fav=!!favs[k];
   html+=`<article class="item" onclick='openModal(${JSON.stringify(c.nome)},${JSON.stringify(s.nome)})'>
    <div class="iicon">${s.icon||"🏢"}</div>
    <div class="idata"><div class="iname">${esc(s.nome)}</div><div class="iaddr">${esc(s.indirizzo)}</div>
    <div class="badges">${s.notaPos?'<span class="badge">📍 Accesso</span>':""}${note?'<span class="badge">✏️ Nota</span>':""}${fav?'<span class="badge">⭐ Preferita</span>':""}</div></div>
    <div class="star">${fav?"★":"›"}</div></article>`;
  });
  html+="</div></section>";
 });
 box.innerHTML=html||`<div class="empty"><div style="font-size:34px">🔎</div><b>Nessun risultato</b><p style="margin-top:6px">Prova con un altro nome, comune o indirizzo.</p></div>`;
 document.getElementById("stats").textContent=(q||filterMode!=="all")?`${visible} risultati su ${total} strutture`:`${total} strutture in ${comuni.length} gruppi`;
}

function esc(v){return String(v||"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function toggleSection(i){openSections.has(i)?openSections.delete(i):openSections.add(i);render()}
function expandAll(){comuni.forEach((_,i)=>openSections.add(i));render()}
function collapseAll(){openSections.clear();render()}
function searchNow(){document.getElementById("clearBtn").style.display=document.getElementById("searchInput").value?"block":"none";render()}
function clearSearch(){document.getElementById("searchInput").value="";searchNow();document.getElementById("searchInput").focus()}
function setFilter(m){filterMode=m;["allBtn","favBtn","notesBtn"].forEach(id=>document.getElementById(id).classList.remove("active"));document.getElementById(m==="all"?"allBtn":m==="fav"?"favBtn":"notesBtn").classList.add("active");render()}

function findPlace(cn,sn){const c=comuni.find(x=>x.nome===cn);return {c,s:c.strutture.find(x=>x.nome===sn)}}
function openModal(cn,sn){
 current=findPlace(cn,sn);const {c,s}=current,k=key(c.nome,s.nome),note=getNotes()[k]||"";
 document.getElementById("mComune").textContent=c.nome;document.getElementById("mNome").textContent=s.nome;document.getElementById("mIndirizzo").textContent=s.indirizzo;
 setRow("posRow","mPos",s.notaPos);setRow("gestRow","mGest",s.gestione);setRow("keyRow","mKey",s.keybox);setRow("noteRow","mNote",note);
 document.getElementById("noteText").value=note;document.getElementById("noteBox").classList.remove("show");document.getElementById("modal").classList.add("open");document.body.style.overflow="hidden";
}
function setRow(row,val,text){document.getElementById(row).style.display=text?"block":"none";document.getElementById(val).textContent=text||""}
function closeModal(){document.getElementById("modal").classList.remove("open");document.body.style.overflow=""}
function overlayClose(e){if(e.target.id==="modal")closeModal()}
function openMaps(){if(!current)return;const s=current.s;window.open(s.mapsUrl||("https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(s.nome+" "+s.indirizzo)),"_blank","noopener")}
async function copyAddress(){if(!current)return;try{await navigator.clipboard.writeText(current.s.indirizzo);toast("Indirizzo copiato ✓")}catch{prompt("Copia l'indirizzo:",current.s.indirizzo)}}
function toggleFavorite(){if(!current)return;const k=key(current.c.nome,current.s.nome),f=getFavs();f[k]=!f[k];if(!f[k])delete f[k];saveFavs(f);toast(f[k]?"Aggiunta alle preferite ⭐":"Tolto dalle preferite");render()}
function toggleNote(){document.getElementById("noteBox").classList.toggle("show");setTimeout(()=>document.getElementById("noteText").focus(),100)}
function saveNote(){if(!current)return;const k=key(current.c.nome,current.s.nome),n=getNotes(),t=document.getElementById("noteText").value.trim();if(t)n[k]=t;else delete n[k];saveNotes(n);setRow("noteRow","mNote",t);document.getElementById("noteBox").classList.remove("show");toast("Nota salvata ✓");render()}
function deleteNote(){document.getElementById("noteText").value="";saveNote()}

function openMenu(){document.getElementById("menu").classList.add("open")}
function closeMenu(){document.getElementById("menu").classList.remove("open")}
function menuClose(e){if(e.target.id==="menu")closeMenu()}
function exportData(){
 const data={version:2,exported:new Date().toISOString(),notes:getNotes(),favorites:getFavs()};
 const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"}),a=document.createElement("a");
 a.href=URL.createObjectURL(blob);a.download="renovit-backup-"+new Date().toISOString().slice(0,10)+".json";a.click();URL.revokeObjectURL(a.href);toast("Backup esportato ✓");closeMenu();
}
function importData(e){
 const file=e.target.files[0];if(!file)return;const r=new FileReader();
 r.onload=()=>{try{const d=JSON.parse(r.result);if(d.notes)saveNotes(d.notes);if(d.favorites)saveFavs(d.favorites);render();toast("Backup importato ✓");closeMenu()}catch{alert("File di backup non valido.")}};
 r.readAsText(file);e.target.value="";
}
function toggleDark(){document.body.classList.toggle("dark");localStorage.setItem("renovit_dark",document.body.classList.contains("dark")?"1":"0");closeMenu()}
function toast(t){const el=document.getElementById("toast");el.textContent=t;el.classList.add("show");clearTimeout(window._toast);window._toast=setTimeout(()=>el.classList.remove("show"),2200)}
document.addEventListener("keydown",e=>{if(e.key==="Escape"){closeModal();closeMenu()}});
if(localStorage.getItem("renovit_dark")==="1"||(!localStorage.getItem("renovit_dark")&&matchMedia("(prefers-color-scheme:dark)").matches))document.body.classList.add("dark");
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
render();
</script>
</body>
</html>
